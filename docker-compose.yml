services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alammoba
      POSTGRES_USER: alammoba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alammoba_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
