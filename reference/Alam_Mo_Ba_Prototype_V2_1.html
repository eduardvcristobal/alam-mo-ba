{id:6,g:8,s:"AP",e:"🌋",en:"The Philippines sits on the Pacific Ring of Fire and has 24 active volcanoes, according to PHIVOLCS.",fil:"Nasa Pacific Ring of Fire ang Pilipinas at may 24 na aktibong bulkan, ayon sa PHIVOLCS.",q:{en:"Why does the Philippines have many volcanoes and earthquakes?",fil:"Bakit maraming bulkan at lindol sa Pilipinas?",o:[["It lies on the Pacific Ring of Fire","Nasa Pacific Ring of Fire ito"],["It is near the North Pole","Malapit ito sa North Pole"],["Because of typhoons","Dahil sa mga bagyo"]],a:0,x:{en:"The Ring of Fire is where tectonic plates meet, so volcanic and earthquake activity is frequent.",fil:"Dito nagtatagpo ang mga tectonic plate, kaya madalas ang pagputok ng bulkan at paglindol."}}},

{id:8,g:9,s:"Math",e:"🔢",en:"Pi (π) is irrational: its decimal digits never end and never repeat.",fil:"Ang pi (π) ay irasyonal na bilang: hindi nagtatapos at hindi umuulit ang mga digit nito sa desimal.",q:{en:"Which statement about π is true?",fil:"Alin ang tama tungkol sa π?",o:[["Its decimals never end or repeat","Hindi nagtatapos o umuulit ang desimal nito"],["It equals exactly 22/7","Eksaktong 22/7 ito"],["It ends after 10 digits","Nagtatapos ito pagkatapos ng 10 digit"]],a:0,x:{en:"22/7 is only a close estimate of π, not its exact value.",fil:"Ang 22/7 ay malapit na tantiya lamang ng π, hindi ang eksaktong halaga nito."}}},

// Alam Mo Ba? Prototype V2 — offline-capable single-file demonstration.
// Sample content remains from the original prototype; references are not yet verified.
const STORE='alammoba.prototype.v2';
const NAMES={Science:['Science','Agham'],AP:['Araling Panlipunan','Araling Panlipunan'],MAPEH:['MAPEH','MAPEH'],Filipino:['Filipino','Filipino'],Math:['Mathematics','Matematika'],TLE:['Technology & Livelihood','Teknolohiya at Kabuhayan']};
const TOPICS={Science:'Science & Nature',AP:'History & Places',MAPEH:'Arts & Culture',Filipino:'Language & Culture',Math:'Math & Logic',TLE:'Technology'};
const TOPIC_ICONS={Science:'🔬',AP:'🌏',MAPEH:'🎨',Filipino:'📖',Math:'🔢',TLE:'💻'};
const DEFAULT={mode:null,grade:7,lang:'en',tab:'home',category:'all',saved:[],learned:[],attempts:[],streak:0,lastLearned:'',interests:[],theme:'auto',notifications:false,showOnboard:true,quizCount:5};
let state={...DEFAULT};
try {const x=JSON.parse(localStorage.getItem(STORE)||'{}');state={...state,...x};} catch(e){}
let ui={modal:null,search:'',factOffset:0,quiz:null,quizResult:false,toastId:null,profileDemo:false};
const $=id=>document.getElementById(id);
function persist(){try{const {mode,grade,lang,category,saved,learned,attempts,streak,lastLearned,interests,theme,notifications,showOnboard,quizCount}=state;localStorage.setItem(STORE,JSON.stringify({mode,grade,lang,category,saved,learned,attempts,streak,lastLearned,interests,theme,notifications,showOnboard,quizCount}));}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function fil(en,fi){return state.lang==='fil'?fi:en;}
function copy(f){return state.lang==='fil'?f.fil:f.en;}
function label(f){return state.mode==='student'?(NAMES[f.s]?.[state.lang==='fil'?1:0]||f.s):(TOPICS[f.s]||f.s);}
function todayKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function priorKey(){const d=new Date();d.setDate(d.getDate()-1);return todayKey(d)}
function dayNumber(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function pool(){return F.filter(f=>(state.mode!=='student'||state.grade==='all'||f.g===state.grade)&&(state.category==='all'||f.s===state.category))}
function allPool(){return F.filter(f=>(state.mode!=='student'||state.grade==='all'||f.g===state.grade))}
function dailyFact(){const p=pool();return p.length?p[(dayNumber()+ui.factOffset)%p.length]:null;}
function catOptions(){return ['all',...Object.keys(NAMES)]}
function countQuizzes(){return F.filter(f=>!!f.q).length}
function startMode(m){state.mode=m;state.tab='home';state.category='all';ui.factOffset=0;ui.quiz=null;state.showOnboard=false;persist();render()}
function activeStreak(){return [todayKey(),priorKey()].includes(state.lastLearned)?state.streak:0}
function markLearned(f){if(!f)return;const k=todayKey();if(!state.learned.includes(f.id))state.learned.push(f.id);if(state.lastLearned!==k){state.streak=state.lastLearned===priorKey()?state.streak+1:1;state.lastLearned=k;}persist();toast(fil('Added to your learning history','Nagdagdag sa iyong mga natutuhan'));render()}
function toggleSave(f){if(!f)return;state.saved=state.saved.includes(f.id)?state.saved.filter(x=>x!==f.id):[...state.saved,f.id];persist();render()}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(ui.toastId);ui.toastId=setTimeout(()=>e.classList.remove('show'),2300)}
function setTab(t){state.tab=t;ui.search='';ui.quiz=null;ui.quizResult=false;ui.factOffset=0;render();window.scrollTo({top:0,behavior:'instant'})}
function nav(){return state.mode==='student'?[['home','🏠',fil('Home','Home')],['learn','📚',fil('Learn','Aralin')],['quiz','🧠',fil('Quiz','Pagsusulit')],['progress','📊',fil('Progress','Progreso')],['profile','👤',fil('Profile','Profile')]]:[['home','🏠',fil('Home','Home')],['discover','🧭',fil('Discover','Tuklasin')],['quiz','🏆',fil('Trivia','Trivia')],['saved','⭐',fil('Saved','Naka-save')],['profile','👤',fil('Profile','Profile')]]}
function displayHeader(){return `<header class="v2-head"><div class="brand"><b>Alam Mo Ba?</b><small>${state.mode==='student'?'🎓 '+fil('Student Mode','Student Mode')+' · '+(state.grade==='all'?fil('All grades','Lahat ng baitang'):fil('Grade','Baitang')+' '+state.grade):'🌍 '+fil('Explore Mode','Explore Mode')}</small></div><button class="streak" data-a="progress" aria-label="View learning progress">🔥 ${activeStreak()} <small>${fil('days','araw')}</small></button></header>`}
function displayNav(){return `<nav class="v2-nav" aria-label="Main navigation">${nav().map(([id,ico,txt])=>`<button class="${state.tab===id?'on':''}" data-a="tab" data-i="${id}" ${state.tab===id?'aria-current="page"':''}><i>${ico}</i><span>${txt}</span></button>`).join('')}</nav>`}
function topTitle(t,d){return `<div class="page-title"><h1>${t}</h1><p>${d}</p></div>`}
function miniFact(f){return `<article class="fact-mini"><div class="mini-emoji">${f.e}</div><div class="mini-info"><span class="eyebrow">${esc(label(f))}${state.mode==='student'?' · '+fil('Grade','Baitang')+' '+f.g:''}</span><p>${esc(copy(f))}</p><div class="mini-actions"><button class="txt-btn" data-a="viewfact" data-i="${f.id}">${fil('Read fact','Basahin')} →</button><button class="tiny-save" data-a="saveid" data-i="${f.id}" aria-label="${state.saved.includes(f.id)?'Remove saved fact':'Save fact'}">${state.saved.includes(f.id)?'★':'☆'}</button></div></div></article>`}
function factCard(f,isDaily){if(!f)return `<div class="panel">${fil('No facts match this selection.','Walang tugmang kaalaman.')}</div>`;let saved=state.saved.includes(f.id),done=state.learned.includes(f.id);return `<section class="hero fact-hero"><div class="art">${f.e}</div><div class="chips"><span class="chip">${isDaily?'📅 '+fil('Fact of the day','Kaalaman ng araw'):'✨ '+fil('Discovery','Tuklas')}</span><span class="chip">${esc(label(f))}</span>${state.mode==='student'?`<span class="chip">${fil('Grade','Baitang')} ${f.g}</span>`:''}</div><h2>${fil('Did you know?','Alam mo ba?')}</h2><p class="fact">${esc(copy(f))}</p><div class="row"><button class="btn pri" data-a="learned" data-i="${f.id}">${done?'✓ '+fil('Learned','Natutunan'):'✓ '+fil('I learned this','Natutunan ko')}</button><button class="btn" data-a="saveid" data-i="${f.id}">${saved?'★ '+fil('Saved','Naka-save'):'☆ '+fil('Save','I-save')}</button><button class="btn" data-a="shareid" data-i="${f.id}">↗ ${fil('Share','Ibahagi')}</button></div></section>`}
function controls(){return `<div class="v2-controls"><button class="filter-pill" data-a="grades">${state.mode==='student'?'🎓 '+(state.grade==='all'?fil('All grades','Lahat'):fil('Grade','Baitang')+' '+state.grade):'🌍 '+fil('All ages','Lahat ng edad')} ▾</button><button class="filter-pill grow" data-a="categories">${state.category==='all'?fil('📚 All topics','📚 Lahat ng paksa'):TOPIC_ICONS[state.category]+' '+esc(label({s:state.category}))} ▾</button><button class="lang-pill" data-a="lang">${state.lang==='en'?'EN':'FIL'} <span>⇄</span></button></div>`}
function todayView(){const f=dailyFact(),other=allPool().filter(x=>x.id!==(f&&f.id));let examples=other.slice(0,2);return `${topTitle(state.mode==='student'?fil('Your learning journey','Paglalakbay sa pag-aaral'):fil('Stay curious!','Patuloy na mag-usisa!'),state.mode==='student'?fil('One discovery at a time.','Isang bagong kaalaman bawat araw.'):fil('Big discoveries start with small questions.','Nagsisimula ang pagtuklas sa mga tanong.'))}${controls()}${factCard(f,true)}<div class="under-card"><button class="btn wide-next" data-a="nextfact">🔄 ${fil('Discover another fact','Tumuklas pa ng kaalaman')}</button></div><div class="section-head"><h2>${state.mode==='student'?fil('Keep learning','Magpatuloy sa pag-aaral'):fil('Explore more','Tuklas pa')}</h2><button class="txt-btn" data-a="tab" data-i="${state.mode==='student'?'learn':'discover'}">${fil('View all','Tingnan lahat')} →</button></div>${examples.map(miniFact).join('')}<div class="challenge-card"><div class="challenge-icon">🧠</div><div><b>${fil('Daily quiz','Araw-araw na quiz')}</b><p>${fil('Try a quick knowledge challenge.','Subukan ang maikling pagsusulit.')}</p></div><button class="btn pri" data-a="tab" data-i="quiz">${fil('Play','Simulan')}</button></div><p class="note">${fil('Prototype content: educational sample facts; formal citations, curriculum mapping, and teacher verification will be added before publication.','Sample lamang ang mga kaalaman. Magdaragdag ng mga sanggunian at beripikasyon bago ilathala.')}</p>`}
function searchArea(){return `<label class="search-area"><span>⌕</span><input id="searchFacts" placeholder="${fil('Search facts and topics','Maghanap ng kaalaman')}" value="${esc(ui.search)}" autocomplete="off" aria-label="Search facts"></label>`}
function categoryChips(){return `<div class="topic-scroll">${catOptions().map(c=>`<button class="topic-chip ${state.category===c?'selected':''}" data-a="category" data-i="${c}">${c==='all'?'📚 '+fil('All','Lahat'):TOPIC_ICONS[c]+' '+(state.mode==='student'?NAMES[c][state.lang==='fil'?1:0]:TOPICS[c])}</button>`).join('')}</div>`}
function browseView(){let l=allPool().filter(f=>(state.category==='all'||f.s===state.category)&&(!ui.search||[f.en,f.fil,f.s,TOPICS[f.s]].join(' ').toLowerCase().includes(ui.search.toLowerCase())));return `${topTitle(state.mode==='student'?fil('Learn by subject','Matuto ayon sa asignatura'):fil('Discover the world','Tuklasin ang mundo'),state.mode==='student'?fil('Explore subjects and fascinating lessons.','Pumili ng asignatura at aralin.'):fil('Follow your curiosity across every topic.','Sundan ang iyong interes sa bawat paksa.'))}${state.mode==='student'?controls():''}${searchArea()}${categoryChips()}<div class="result-count">${l.length} ${fil('discoveries','kaalaman')}</div>${l.map(miniFact).join('')||`<div class="empty">🔎<h3>${fil('No matching facts','Walang nahanap')}</h3><p>${fil('Try another topic or search.','Subukan ang ibang paksa.')}</p></div>`}`}
function savedView(){let l=F.filter(f=>state.saved.includes(f.id));return `${topTitle(fil('Saved discoveries','Mga naka-save'),fil('Your personal collection of fascinating facts.','Mga kaalamang nais mong balikan.'))}${l.length?l.map(miniFact).join(''):`<div class="empty">⭐<h3>${fil('Nothing saved yet','Wala pang naka-save')}</h3><p>${fil('Tap Save on any fact to build your collection.','I-save ang mga kaalamang gusto mong balikan.')}</p><button class="btn pri" data-a="tab" data-i="${state.mode==='student'?'learn':'discover'}">${fil('Browse facts','Tuklasin ang kaalaman')}</button></div>`}`}
function progressView(){let answers=state.attempts.reduce((a,q)=>a+q.total,0),correct=state.attempts.reduce((a,q)=>a+q.score,0),rate=answers?Math.round(correct/answers*100):0;let done=state.learned.length;return `${topTitle(fil('My learning progress','Aking progreso'),fil('Celebrate what you have discovered.','Ipagdiwang ang iyong natutuhan.'))}<div class="stats-grid"><div class="stat"><span>📚</span><b>${done}</b><small>${fil('Facts learned','Natutunan')}</small></div><div class="stat"><span>🎯</span><b>${answers?rate+'%':'—'}</b><small>${fil('Quiz accuracy','Katumpakan')}</small></div><div class="stat"><span>🔥</span><b>${activeStreak()}</b><small>${fil('Day streak','Tuloy-tuloy')}</small></div><div class="stat"><span>🏆</span><b>${state.attempts.length}</b><small>${fil('Quizzes finished','Natapos na quiz')}</small></div></div><section class="panel"><h3>${fil('Your learning milestones','Mga tagumpay')}</h3><div class="achievement">${done>=1?'✅':'🔒'} ${fil('First Discovery — Learn your first fact','Unang Kaalaman — Matuto ng isang kaalaman')}</div><div class="achievement">${state.attempts.length>=1?'✅':'🔒'} ${fil('Quiz Starter — Complete a quiz','Unang Quiz — Tapusin ang pagsusulit')}</div><div class="achievement">${done>=10?'✅':'🔒'} ${fil('Curious Mind — Learn 10 facts','Masigasig — Matuto ng 10 kaalaman')}</div></section><div class="section-head"><h2>${fil('Recent quiz results','Mga huling quiz')}</h2></div>${state.attempts.length?state.attempts.slice(-5).reverse().map(a=>`<div class="attempt"><span>🧠 ${esc(a.name||'Quiz')}<small>${esc(a.date)}</small></span><b>${a.score}/${a.total}</b></div>`).join(''):`<p class="note">${fil('Complete a quiz to see results here.','Tapusin ang quiz para makita ang resulta.')}</p>`}<div class="sync-hint">☁️ ${fil('Guest progress stays on this device. Create an account later to sync across devices.','Sa device na ito lang naiipon ang guest progress. Mag-account para ma-sync.')}</div>`}
function quizEligible(type){let q=F.filter(f=>f.q&&(state.mode!=='student'||state.grade==='all'||f.g===state.grade)&&(state.category==='all'||f.s===state.category));if(type==='review'){const bad=new Set(state.attempts.flatMap(a=>a.wrong||[]));q=q.filter(f=>bad.has(f.id));}return q;}
function quizView(){if(ui.quiz)return quizPlayer();const total=quizEligible('mixed').length, reviewTotal=quizEligible('review').length;const preferred=Number(state.quizCount)||5;return `${topTitle(state.mode==='student'?fil('Practice and grow','Magsanay at matuto'):fil('Trivia Arena','Trivia Arena'),fil('Challenge yourself and learn from every answer.','Subukan ang kaalaman at matuto sa bawat sagot.'))}<div class="quiz-banner">🏆 <b>${fil('Ready for a challenge?','Handa ka na ba?')}</b><p>${fil('Each question includes a helpful explanation.','Bawat tanong ay may paliwanag.')}</p></div><div class="quiz-config"><label for="quizCount"><b>🎯 ${fil('Questions per quiz','Bilang ng tanong bawat quiz')}</b><small>${fil('Choose the number you want to answer.','Piliin kung ilang tanong ang sasagutan.')}</small></label><div class="quiz-count-controls"><button data-a="countdown" aria-label="Fewer questions" ${preferred<=1?'disabled':''}>−</button><input id="quizCount" type="number" min="1" max="100" step="1" inputmode="numeric" value="${preferred}" aria-label="Questions per quiz"><button data-a="countup" aria-label="More questions" ${preferred>=100?'disabled':''}>+</button></div><p class="quiz-available">${total} ${fil('questions currently available for this selection. If you choose more, the quiz uses all available questions.','tanong ang available para sa pagpiling ito. Kung mas marami ang pinili, lahat ng available na tanong ang gagamitin.')}</p></div><div class="quiz-modes"><button class="quiz-mode" data-a="startquiz" data-i="daily"><span>⚡</span><div><b>${fil('Daily Challenge','Araw-araw na Hamon')}</b><small>${fil('Play with your chosen question count','Gamitin ang piniling bilang ng tanong')}</small></div><strong>→</strong></button><button class="quiz-mode" data-a="startquiz" data-i="mixed"><span>🧠</span><div><b>${fil('Knowledge Mix','Halo-halong Kaalaman')}</b><small>${total} ${fil('sample questions available','halimbawang tanong')}</small></div><strong>→</strong></button><button class="quiz-mode" data-a="startquiz" data-i="review"><span>🔁</span><div><b>${fil('Review Mistakes','Balikan ang mga Mali')}</b><small>${reviewTotal} ${fil('questions to review','tanong na babalikan')}</small></div><strong>→</strong></button></div><p class="note">${fil('Answer choices are randomized for new sets. After each quiz, repeat the exact same questions or try a different set.','Halo-halo ang sagot sa bagong set. Pagkatapos ng quiz, ulitin ang parehong mga tanong o sumubok ng ibang set.')}</p>`}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function makeQuizQuestions(facts,previous){return facts.map(f=>({id:f.id,f,order:previous?.get(f.id)?.order?.slice()||shuffle(f.q.o.map((_,i)=>i)),pick:null,submitted:false,hidden:[],lifeline:false}));}
function launchQuiz(type,behavior='new'){const prior=ui.quiz;let pool=quizEligible(type);if(!pool.length){toast(type==='review'?fil('No mistakes to review yet. Try another quiz!','Wala pang maling sagot na babalikan.'):fil('No quiz questions available for this selection.','Walang tanong sa pagpiling ito.'));return;}
const wanted=Math.max(1,Math.min(100,Math.round(Number(state.quizCount)||5)));const length=Math.min(wanted,pool.length);let facts;
if(behavior==='repeat'&&prior&&prior.type===type){facts=prior.questions.map(x=>x.f);const old=new Map(prior.questions.map(x=>[x.id,x]));ui.quiz={type,questions:makeQuizQuestions(facts,old),index:0,score:0,wrong:[]};}
else{const oldIds=new Set(prior?.questions.map(x=>x.id)||[]);const unseen=shuffle(pool.filter(f=>!oldIds.has(f.id)));const seen=shuffle(pool.filter(f=>oldIds.has(f.id)));facts=[...unseen,...seen].slice(0,length);ui.quiz={type,questions:makeQuizQuestions(facts),index:0,score:0,wrong:[]};if(behavior==='different'&&unseen.length===0)toast(fil('All available questions were in your last set; reshuffling them.','Nagamit na ang lahat ng tanong; ihahalo muli ang mga ito.'));}
ui.quizResult=false;render();}
function quizPlayer(){let s=ui.quiz,t=s.questions.length;if(s.index>=t)return quizFinish();let x=s.questions[s.index],q=x.f.q,trans=state.lang==='fil'?'fil':'en';return `<div class="quiz-top"><button class="back-link" data-a="quitquiz">← ${fil('Back to quizzes','Bumalik sa quizzes')}</button><span>${s.index+1} / ${t}</span></div><section class="mw"><div class="top"><button class="ll" data-a="fifty" ${x.lifeline||x.submitted?'disabled':''}>50:50</button><div class="lad">${s.questions.map((_,i)=>`<span class="${i<=s.index?'on':''}"></span>`).join('')}</div></div><div class="meta">${fil('QUESTION','TANONG')} ${s.index+1} / ${t}</div><div class="mq"><h2>${esc(q[trans])}</h2></div><div class="opts">${x.order.map((original,pos)=>{let cls='opt';if(x.hidden.includes(original))cls+=' hid';else if(x.submitted){if(original===q.a)cls+=' ok';else if(original===x.pick)cls+=' bad';}else if(original===x.pick)cls+=' pk';return `<button class="${cls}" data-a="option" data-i="${original}" ${x.submitted||x.hidden.includes(original)?'disabled':''}><b>${'ABCD'[pos]}:</b><span>${esc(q.o[original][state.lang==='fil'?1:0])}</span></button>`}).join('')}</div>${!x.submitted&&x.pick!==null?`<button class="final" data-a="submitanswer">${fil('Final answer','Pinal na sagot')}</button>`:''}${x.submitted?`<p class="expl"><b>${x.pick===q.a?fil('Correct!','Tama!'):fil('Not quite.','Hindi pa tama.')}</b> ${esc(q.x[trans])}</p><button class="final" data-a="nextq">${s.index===t-1?fil('See my results','Tingnan ang resulta'):fil('Next question','Susunod na tanong')} →</button>`:''}</section>`}
function quizFinish(){let s=ui.quiz;let available=quizEligible(s.type).length,unseen=quizEligible(s.type).filter(f=>!s.questions.some(x=>x.id===f.id)).length;return `<div class="result-panel"><span class="result-emoji">${s.score===s.questions.length?'🏆':'🎉'}</span><h1>${fil('Quiz complete!','Tapos na ang quiz!')}</h1><p>${fil('You scored','Nakakuha ka ng')}</p><div class="result-score">${s.score} <small>/ ${s.questions.length}</small></div><p>${fil('What would you like to do next?','Ano ang gusto mong susunod?')}</p><button class="btn pri wide" data-a="repeatquiz">🔁 ${fil('Repeat the same questions','Ulitin ang parehong mga tanong')}</button><button class="btn wide" data-a="differentquiz">✨ ${fil('Try another question set','Sumubok ng ibang set ng tanong')}</button><p class="note">${unseen>0?`${unseen} ${fil('other questions available','iba pang tanong ang available')}`:fil('If no unused questions remain, another set will reshuffle existing questions.','Kung wala nang bagong tanong, ihahalo muli ang mga kasalukuyang tanong.')}</p><button class="btn wide" data-a="quitquiz">← ${fil('Back to quizzes','Bumalik sa quizzes')}</button></div>`}
function profileView(){return `${topTitle(fil('Your profile','Iyong Profile'),fil('Personalize how you learn.','Iangkop ang iyong pag-aaral.'))}<div class="guest-profile"><div class="guest-avatar">👋</div><div><b>${fil('Learning as a guest','Nag-aaral bilang guest')}</b><p>${fil('Your progress is saved on this device.','Naka-save ang progreso sa device na ito.')}</p></div></div><button class="btn pri wide" data-a="account">☁️ ${fil('About creating an account','Tungkol sa account')}</button><section class="settings"><h2>${fil('Learning preferences','Mga kagustuhan')}</h2><button class="setting" data-a="switchmode"><span>🔀 ${fil('Learning mode','Paraan ng pag-aaral')}</span><strong>${state.mode==='student'?'🎓 Student':'🌍 Explore'} ▾</strong></button>${state.mode==='student'?`<button class="setting" data-a="grades"><span>🎓 ${fil('Grade level','Baitang')}</span><strong>${state.grade==='all'?fil('All','Lahat'):state.grade} ▾</strong></button>`:''}<button class="setting" data-a="lang"><span>🌐 ${fil('Language','Wika')}</span><strong>${state.lang==='en'?'English':'Filipino'} ▾</strong></button><button class="setting" data-a="theme"><span>🌗 ${fil('Appearance','Itsura')}</span><strong>${state.theme==='auto'?fil('System','System'):state.theme==='dark'?fil('Dark','Madilim'):fil('Light','Maliwanag')} ▾</strong></button><button class="setting" data-a="remind"><span>🔔 ${fil('Daily reminder (demo only)','Paalala (demo lamang)')}</span><strong>${state.notifications?'On':'Off'}</strong></button></section><section class="settings"><h2>${fil('My collection','Aking koleksyon')}</h2><button class="setting" data-a="tab" data-i="saved"><span>⭐ ${fil('Saved facts','Naka-save')}</span><strong>${state.saved.length} →</strong></button><button class="setting" data-a="tab" data-i="progress"><span>📈 ${fil('Learning history','Kasaysayan ng pag-aaral')}</span><strong>→</strong></button></section><button class="btn wide" data-a="resetconfirm">${fil('Reset prototype progress','I-reset ang progreso')}</button><p class="note">${fil('Prototype V2 · Sample content and local guest progress only. Sign-up, reminders, and cloud sync are not connected to a server.','Prototype V2 · Mga halimbawa at lokal na guest progress lamang. Wala pang server para sa account at paalala.')}</p>`}
function modeScreen(){return `<div class="onboard"><div class="onboard-mark">💡</div><div class="onboard-title">Alam Mo Ba?</div><p>${fil('Discover. Learn. Challenge Yourself.','Tumuklas. Matuto. Subukan ang sarili.')}</p><div class="onboard-message"><h2>${fil('How would you like to learn?','Paano mo gustong matuto?')}</h2><span>${fil('Start right away — no account needed.','Magsimula agad — walang account na kailangan.')}</span></div><button class="mode-card" data-a="choosemode" data-i="student"><span class="mode-symbol">🎓</span><span><b>${fil('Student Mode','Student Mode')}</b><small>${fil('Learn by grade, subject, and topic','Matuto ayon sa baitang at asignatura')}</small></span><strong>→</strong></button><button class="mode-card" data-a="choosemode" data-i="explore"><span class="mode-symbol">🌍</span><span><b>${fil('Explore Mode','Explore Mode')}</b><small>${fil('Discover facts, stories, and trivia','Tuklasin ang mga kaalaman at trivia')}</small></span><strong>→</strong></button><div class="onboard-footer">🔒 ${fil('Your activity stays on this device until you choose to create an account.','Dito muna sa device naka-save ang iyong pag-aaral.')}</div><button class="lang-onboard" data-a="lang">🌐 ${state.lang==='en'?'English · Switch to Filipino':'Filipino · Switch to English'}</button></div>`}
function modalBody(){if(ui.modal==='modes')return `<h3>${fil('Switch learning mode','Palitan ang mode')}</h3><button class="o" data-a="choosemode" data-i="student">🎓 <span>${fil('Student Mode','Student Mode')}<small>${fil('Learn by grade','Ayon sa baitang')}</small></span></button><button class="o" data-a="choosemode" data-i="explore">🌍 <span>${fil('Explore Mode','Explore Mode')}<small>${fil('Follow your curiosity','Sundan ang interes')}</small></span></button>`;if(ui.modal==='grades')return `<h3>${fil('Choose grade level','Pumili ng baitang')}</h3>${['all',7,8,9].map(g=>`<button class="o ${state.grade===g?'on':''}" data-a="grade" data-i="${g}">${g==='all'?'📚 '+fil('All grades','Lahat ng baitang'):'🎓 '+fil('Grade','Baitang')+' '+g}${state.grade===g?' ✓':''}</button>`).join('')}`;if(ui.modal==='categories')return `<h3>${fil('Choose a topic','Pumili ng paksa')}</h3>${catOptions().map(c=>`<button class="o ${state.category===c?'on':''}" data-a="category" data-i="${c}">${c==='all'?'📚 '+fil('All topics','Lahat ng paksa'):TOPIC_ICONS[c]+' '+esc(state.mode==='student'?NAMES[c][state.lang==='fil'?1:0]:TOPICS[c])}${state.category===c?' ✓':''}</button>`).join('')}`;if(ui.modal==='account')return `<h3>☁️ ${fil('Save your journey','I-save ang progreso')}</h3><p class="modal-text">${fil('Accounts and cross-device sync are planned for the full application. For now, everything you learn is stored locally in this browser.','Plano pa lang ang account at pag-sync. Sa browser na ito muna naka-save ang iyong progreso.')}</p><button class="btn pri wide" data-a="close">${fil('Continue as guest','Magpatuloy bilang guest')}</button>`;if(ui.modal==='reset')return `<h3>${fil('Reset progress?','I-reset ang progreso?')}</h3><p class="modal-text">${fil('This clears saved facts, streaks, and quiz results on this device. This cannot be undone.','Mabubura ang naka-save, streak, at mga resulta ng quiz sa device na ito.')}</p><button class="btn danger wide" data-a="reset">${fil('Yes, reset my progress','Oo, i-reset')}</button><button class="btn wide" data-a="close">${fil('Cancel','Kanselahin')}</button>`;if(ui.modal?.startsWith('fact:')){const f=F.find(x=>x.id===Number(ui.modal.split(':')[1]));return f?`<h3>${f.e} ${fil('Did you know?','Alam mo ba?')}</h3><p class="modal-text">${esc(copy(f))}</p><p class="note">${esc(label(f))} · ${fil('Sample content: source verification pending.','Halimbawa lamang; wala pang beripikadong sanggunian.')}</p><div class="row"><button class="btn pri" data-a="learned" data-i="${f.id}">✓ ${fil('I learned this','Natutunan ko')}</button><button class="btn" data-a="saveid" data-i="${f.id}">${state.saved.includes(f.id)?'★':'☆'} ${fil('Save','I-save')}</button></div>`:'';}return ''}
function render(){document.documentElement.lang=state.lang==='fil'?'fil':'en';document.documentElement.dataset.theme=state.theme==='auto'?'':state.theme;const onboarding=!state.mode||state.showOnboard;$('app').className=onboarding?'app onboarding-app':'app';$('app').innerHTML=onboarding?modeScreen():displayHeader()+`<main id="view">${state.tab==='home'?todayView():state.tab==='learn'||state.tab==='discover'?browseView():state.tab==='quiz'?quizView():state.tab==='saved'?savedView():state.tab==='progress'?progressView():profileView()}</main>`+displayNav();const ov=$('ov');ov.className='ov'+(ui.modal?' show':'');ov.innerHTML=ui.modal?`<div class="sheet" role="dialog" aria-modal="true" aria-label="Dialog"><button class="modal-x" data-a="close" aria-label="Close">×</button>${modalBody()}</div>`:'';}
function shareFact(f){let msg='💡 '+fil('Did you know?','Alam mo ba?')+' '+copy(f);if(navigator.share){navigator.share({text:msg}).catch(()=>{});return;}if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>toast(fil('Copied to clipboard','Nakopya na'))).catch(()=>toast(msg));else toast(msg)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b){if(e.target.id==='ov'){ui.modal=null;render();}return;}const a=b.dataset.a,id=b.dataset.i,f=F.find(x=>x.id===Number(id));if(a==='choosemode'){ui.modal=null;startMode(id);return}if(a==='tab'){if(id==='saved'&&state.mode==='student'){}setTab(id);return}if(a==='progress'){setTab('progress');return}if(a==='grades'){if(state.mode!=='student'){ui.modal='modes'}else ui.modal='grades';}else if(a==='categories')ui.modal='categories';else if(a==='switchmode')ui.modal='modes';else if(a==='grade'){state.grade=id==='all'?'all':Number(id);state.category='all';ui.factOffset=0;ui.modal=null;persist()}else if(a==='category'){state.category=id;ui.factOffset=0;ui.modal=null;persist()}else if(a==='lang'){state.lang=state.lang==='en'?'fil':'en';persist()}else if(a==='theme'){state.theme=state.theme==='auto'?'dark':state.theme==='dark'?'light':'auto';persist()}else if(a==='learned'){markLearned(f);return}else if(a==='saveid'){toggleSave(f);return}else if(a==='shareid'){shareFact(f);return}else if(a==='viewfact'){ui.modal='fact:'+id;}else if(a==='nextfact'){ui.factOffset++;}else if(a==='countdown'){state.quizCount=Math.max(1,(Number(state.quizCount)||5)-1);persist()}else if(a==='countup'){state.quizCount=Math.min(100,(Number(state.quizCount)||5)+1);persist()}else if(a==='startquiz'){launchQuiz(id);return}else if(a==='repeatquiz'){launchQuiz(ui.quiz.type,'repeat');return}else if(a==='differentquiz'){launchQuiz(ui.quiz.type,'different');return}else if(a==='quitquiz'){ui.quiz=null;ui.quizResult=false;}else if(a==='option'){const q=ui.quiz?.questions[ui.quiz.index];if(q&&!q.submitted&&!q.hidden.includes(Number(id)))q.pick=Number(id)}else if(a==='fifty'){const q=ui.quiz?.questions[ui.quiz.index];if(q&&!q.lifeline&&!q.submitted){const wrong=shuffle([0,1,2].filter(x=>x!==q.f.q.a&&x!==q.pick));q.hidden=[wrong[0]];q.lifeline=true;}}else if(a==='submitanswer'){const q=ui.quiz?.questions[ui.quiz.index];if(q&&q.pick!==null&&!q.submitted){q.submitted=true;if(q.pick===q.f.q.a)ui.quiz.score++;else ui.quiz.wrong.push(q.id)}}else if(a==='nextq'){const s=ui.quiz;s.index++;if(s.index===s.questions.length){state.attempts.push({date:todayKey(),name:s.type==='daily'?'Daily Challenge':s.type==='review'?'Review Mistakes':'Knowledge Mix',score:s.score,total:s.questions.length,wrong:s.wrong});state.attempts=state.attempts.slice(-100);persist()}}else if(a==='account')ui.modal='account';else if(a==='remind'){state.notifications=!state.notifications;persist();toast(fil('Demo preference only — notifications are not enabled.','Demo lamang — walang aktuwal na notification.'))}else if(a==='resetconfirm')ui.modal='reset';else if(a==='reset'){const mode=state.mode,grade=state.grade,lang=state.lang;state={...DEFAULT,mode,grade,lang,showOnboard:false};ui.modal=null;persist();toast(fil('Prototype progress cleared','Nabura ang progreso'))}else if(a==='close')ui.modal=null;render();});
document.addEventListener('input',e=>{if(e.target.id==='quizCount'){const n=Number(e.target.value);if(Number.isInteger(n)&&n>=1&&n<=100){state.quizCount=n;persist();}return;}if(e.target.id==='searchFacts'){const start=e.target.selectionStart;ui.search=e.target.value;const box=$('view');let cursor=box.querySelector('#searchFacts');if(cursor){const anchor=box.querySelector('.result-count');const old=anchor?.nextElementSibling;const l=allPool().filter(f=>(state.category==='all'||f.s===state.category)&&(!ui.search||[f.en,f.fil,f.s,TOPICS[f.s]].join(' ').toLowerCase().includes(ui.search.toLowerCase())));let html=l.map(miniFact).join('')||`<div class="empty">🔎<h3>${fil('No matching facts','Walang nahanap')}</h3></div>`;anchor.textContent=l.length+' '+fil('discoveries','kaalaman');let el=anchor.nextElementSibling;while(el){const n=el.nextElementSibling;el.remove();el=n;}anchor.insertAdjacentHTML('afterend',html);}}});
document.addEventListener('change',e=>{if(e.target.id==='quizCount'){state.quizCount=Math.max(1,Math.min(100,Math.round(Number(e.target.value)||5)));persist();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
render();
</script></body></html>
