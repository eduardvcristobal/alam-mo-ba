server:
  port: ${PORT:8080}
spring:
  application:
    name: alam-mo-ba-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alammoba}
    username: ${DB_USER:alammoba}
    password: ${DB_PASSWORD:alammoba_dev}
  flyway:
    enabled: true
app:
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
  rate-limit:
    guest:
      window-seconds: ${APP_RATE_LIMIT_GUEST_WINDOW_SECONDS:60}
      session-creations-per-window: ${APP_RATE_LIMIT_GUEST_SESSION_CREATIONS_PER_WINDOW:5}
      progress-writes-per-window: ${APP_RATE_LIMIT_GUEST_PROGRESS_WRITES_PER_WINDOW:60}
      max-tracked-keys: ${APP_RATE_LIMIT_GUEST_MAX_TRACKED_KEYS:10000}
